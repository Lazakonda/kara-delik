                right: 0;
                top: 50%;
                transform: translateY(-50%);

                    var doc = new DOMParser().parseFromString(html, "text/html");
                    var root = document.documentElement;
                    Array.prototype.slice.call(doc.documentElement.attributes).forEach(function (a) { root.setAttribute(a.name, a.value); });
                    function swap(dst, src) {
                        while (dst.firstChild) dst.removeChild(dst.firstChild);
                        Array.prototype.slice.call(dst.attributes).forEach(function (a) { dst.removeAttribute(a.name); });
                        Array.prototype.slice.call(src.attributes).forEach(function (a) { dst.setAttribute(a.name, a.value); });
                        Array.prototype.slice.call(src.childNodes).forEach(function (n) { dst.appendChild(document.importNode(n, true)); });
                    }
                    swap(document.head, doc.head);
                    swap(document.body, doc.body);
                    if (doc.title) document.title = doc.title;
                    var scripts = Array.prototype.slice.call(document.querySelectorAll("script"));
                    var deadline = Date.now() + 6000; /* CDN takılırsa uygulama yine de başlar */
                    (function next(i) {
                        if (i >= scripts.length) {
                            try { document.dispatchEvent(new Event("kd:decrypted")); } catch (e) {}
                            return;
                        }
                        var old = scripts[i], s = document.createElement("script");
                        Array.prototype.slice.call(old.attributes).forEach(function (a) { s.setAttribute(a.name, a.value); });
                        if (old.src) {
                            s.async = false;
                            var went = false, go = function () { if (went) return; went = true; next(i + 1); };
                            s.onload = s.onerror = go;
                            setTimeout(go, Math.max(0, deadline - Date.now()));
                            old.parentNode.replaceChild(s, old);
                        } else {
                            s.text = old.textContent;
                            old.parentNode.replaceChild(s, old);
                            next(i + 1);
                        }
                    })(0);
                },
                clearLocalStorageCallback: null,
            };
